# =============================================================================
# application-dev.yml — Profil DÉVELOPPEMENT
#
# Activé avec : --spring.profiles.active=dev
# Ou dans application.yml : spring.profiles.active: dev
#
# Ce profil surcharge les valeurs de application.yml pour le développement local.
# Les valeurs ici sont en clair car ce fichier ne doit JAMAIS être commité
# avec de vraies credentials → voir .gitignore
# =============================================================================

spring:
  jpa:
    # En dev : recrée le schéma à chaque redémarrage si nécessaire
    # Passer à "update" pour conserver les données entre les restarts
    hibernate:
      ddl-auto: update
    # Affiche et formate le SQL généré → utile pour déboguer les requêtes
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # DevTools — rechargement automatique à chaque modification de classe compilée
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# Logging plus verbeux en développement
logging:
  level:
    com.template.auth:          DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL:          DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

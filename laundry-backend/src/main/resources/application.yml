# =============================================================================
# APPLICATION.YML — Configuration principale Spring Boot
#
# Hiérarchie de profils :
#   application.yml         → valeurs partagées (toujours chargé)
#   application-dev.yml     → surcharges pour l'environnement de développement
#   application-prod.yml    → surcharges pour la production
#
# Les variables ${VAR:default} lisent d'abord la variable d'environnement VAR ;
# si absente, elles utilisent la valeur par défaut fournie.
# =============================================================================

# --- Identité de l'application ---

spring:
  application:
    name: vividela-backend

  # ---------------------------------------------------------------------------
  # PROFIL ACTIF PAR DÉFAUT
  # BUGFIX : sans ce réglage, Spring Boot lance le profil "default" qui hérite
  # de tous les paramètres verbeux de application.yml (show-sql: true, logging
  # DEBUG…). En production, surcharger via variable d'environnement :
  #   SPRING_PROFILES_ACTIVE=prod
  # ---------------------------------------------------------------------------
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---------------------------------------------------------------------------
  # SOURCE DE DONNÉES — MySQL via Spring Data JPA / Hibernate
  # ---------------------------------------------------------------------------
  datasource:
    # Chaîne de connexion JDBC MySQL 8.x
    # Configurable via variables d'environnement (utilisé par docker-compose.yml
    # pour pointer vers le service "mysql" du conteneur plutôt que localhost)
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP — pool de connexions haute performance (inclus par défaut)
    hikari:
      maximum-pool-size: 10          # Nombre max de connexions simultanées
      minimum-idle: 2                # Connexions maintenues inactives
      connection-timeout: 30000      # Délai max d'obtention d'une connexion (ms)
      idle-timeout: 600000           # Durée max d'inactivité avant fermeture (ms)

  # ---------------------------------------------------------------------------
  # JPA / HIBERNATE
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      # ddl-auto strategies :
      #   none        → aucune action sur le schéma
      #   validate    → vérifie que le schéma correspond aux entités
      #   update      → met à jour le schéma (à éviter en prod)
      #   create      → recrée le schéma au démarrage (perd les données)
      #   create-drop → idem + supprime au stop (idéal pour les tests)
      ddl-auto: update
    show-sql: true                   # Affiche les requêtes SQL dans les logs
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true             # Formate le SQL affiché pour la lisibilité

  # ---------------------------------------------------------------------------
  # MAIL — Configuration SMTP pour JavaMailSender (notifications par email)
  # Exemple Gmail : MAIL_USERNAME=vous@gmail.com, MAIL_PASSWORD=mot de passe
  # d'application (https://myaccount.google.com/apppasswords)
  # ---------------------------------------------------------------------------
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ---------------------------------------------------------------------------
  # JACKSON — Sérialisation JSON
  # ---------------------------------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false   # LocalDateTime → ISO-8601 ("2024-01-15T10:30:00")
    time-zone: UTC
  # ---------------------------------------------------------------------------
  # SPRING AI — GOOGLE GENAI (GEMINI) — analyse du sentiment des avis clients
  # (voir GeminiReviewAnalysisService). Clé API gratuite : aistudio.google.com/apikey
  # Ne JAMAIS renseigner project-id/location ici : cela basculerait le client
  # en mode Vertex AI (credentials GCP) et la clé API Gemini serait rejetée.
  # ---------------------------------------------------------------------------
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash}
          temperature: 0.2           # Réponse peu créative : classification, pas de génération libre

# ---------------------------------------------------------------------------
# SERVEUR
# ---------------------------------------------------------------------------
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api             # Préfixe de toutes les URLs : /api/...
  error:
    include-message: always          # Inclure le message d'erreur dans la réponse
    include-binding-errors: always

# ---------------------------------------------------------------------------
# JWT — Configuration du token JSON Web Token
# ---------------------------------------------------------------------------
security:
  jwt:
    blacklist-cleanup:
      # Délai entre deux exécutions du job de purge des tokens révoqués
      # expirés dans la table revoked_tokens (ms). Défaut : 1 heure.
      fixed-delay-ms: ${JWT_BLACKLIST_CLEANUP_FIXED_DELAY_MS:3600000}

# ---------------------------------------------------------------------------
# NOTIFICATIONS — Expéditeur par défaut des emails sortants
# ---------------------------------------------------------------------------
notifications:
  mail-from: ${MAIL_FROM}
  # AJOUT : reprise automatique des envois EMAIL/SMS en échec + alerte du
  # personnel en cas d'échec définitif (voir NotificationServiceImpl —
  # retryFailedChannelNotifications / escalateExhaustedNotificationFailures).
  retry:
    # Nombre maximum de tentatives de reprise après l'envoi initial.
    max-attempts: ${NOTIFICATIONS_RETRY_MAX_ATTEMPTS:3}
    # Nombre maximum de notifications retentées par exécution du job.
    batch-size: ${NOTIFICATIONS_RETRY_BATCH_SIZE:100}
    # Délai entre deux exécutions du job de reprise (ms). Défaut : 5 minutes.
    fixed-delay-ms: ${NOTIFICATIONS_RETRY_FIXED_DELAY_MS:300000}
    # Délai avant la première exécution après démarrage (ms). Défaut : 1 minute.
    initial-delay-ms: ${NOTIFICATIONS_RETRY_INITIAL_DELAY_MS:60000}
    # Expression cron du job d'escalade vers le personnel. Défaut : toutes les 15 minutes.
    escalation-cron: ${NOTIFICATIONS_RETRY_ESCALATION_CRON:0 */15 * * * *}

# ---------------------------------------------------------------------------
# IDENTITÉ BOUTIQUE — affichée sur les tickets/reçus PDF (voir ShopProperties)
# Externalisé ici plutôt qu'en dur dans le code pour éviter une recompilation
# à chaque changement (téléphone, nom en cas de multi-boutiques, etc.)
# ---------------------------------------------------------------------------
vividela:
  shop:
    name: ${SHOP_NAME:Vividela}
    phone: ${SHOP_PHONE:+237 000 000 000}
    email: ${SHOP_EMAIL:contact@vividela.com}
  # AJOUT : paramètres du programme de fidélité (voir LoyaltyProperties) —
  # rend fonctionnel un programme jusque-là purement décoratif.
  loyalty:
    point-value: ${LOYALTY_POINT_VALUE:50}
    earn-rate-per-currency-unit: ${LOYALTY_EARN_RATE:0.01}
    max-points-per-order: ${LOYALTY_MAX_POINTS_PER_ORDER:1000}
    points-per-cfa: ${LOYALTY_POINTS_PER_CFA:1}
  # AJOUT : durée de validité d'un ticket de dépôt (code-barres) avant
  # passage automatique au statut EXPIRED (voir TicketServiceImpl).
  ticket:
    validity-days: ${TICKET_VALIDITY_DAYS:90}
    expiration-days: ${TICKET_EXPIRATION_DAYS:3}


jwt:
  # Clé secrète de signature HS256 (min 256 bits = 32 caractères)
  # EN PRODUCTION : définir la variable d'environnement JWT_SECRET avec une
  # clé aléatoire d'au moins 32 caractères. Aucune valeur par défaut n'est
  # fournie ici pour éviter de committer un secret dans le dépôt.
  secret: ${JWT_SECRET}
  # Durée de validité du token d'accès (en millisecondes)
  expiration: ${JWT_EXPIRATION}
  # Préfixe du header Authorization
  prefix: Bearer
  header: Authorization

# ---------------------------------------------------------------------------
# TWILIO — Envoi de SMS (compte d'essai gratuit sur twilio.com/try-twilio)
# En mode "trial", Twilio n'autorise l'envoi que vers des numéros vérifiés
# dans la console, et préfixe chaque SMS d'un message indiquant le compte
# d'essai — c'est normal et gratuit.
# ---------------------------------------------------------------------------
twilio:
  enabled: ${TWILIO_ENABLED}
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  from-number: ${TWILIO_FROM_NUMBER}

# ---------------------------------------------------------------------------
# ACTUATOR — Expose uniquement /actuator/health (utilisé par le HEALTHCHECK
# Docker et les orchestrateurs). Pas de détails internes exposés publiquement.
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ---------------------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------------------
logging:
  level:
    root: info
    com.template.auth: debug         # Logs détaillés pour notre package
    org.springframework.security: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"